plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nokia.pureview'
    compileSdk 33

    defaultConfig {
        applicationId "com.nokia.pureview"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
